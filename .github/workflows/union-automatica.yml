name: Unión automática

# Une una pull request cuando el OTRO agente la aprueba (decisión de la
# persona responsable, 26/10/2026, issue #27). Condiciones, todas obligatorias:
#   - rama claude/* o chatgpt/* del propio repositorio (no de un fork), abierta
#     por la identidad de ese carril (las demás las une la persona responsable);
#   - aprobación APPROVED sobre el último commit de la identidad AUTORIZADA del
#     otro carril (tabla CARRILES); la de cualquier otra cuenta no cuenta;
#   - ninguna revisión CHANGES_REQUESTED vigente (de cualquier revisor);
#   - el workflow «Carril» (.github/workflows/carril.yml de este repositorio)
#     terminó en verde sobre el último commit;
#   - no tiene las etiquetas `pausa` ni `decide-persona`, y no hay ningún
#     issue abierto con la etiqueta `pausa`;
#   - no es borrador y no modifica .github/workflows/ (el GITHUB_TOKEN no puede
#     unir cambios de workflows: esas PR las une la persona responsable).
#
# Puesta en marcha: workflow_run solo se dispara con este archivo en `main`, y
# esta misma PR (#28) modifica workflows, así que la une la persona responsable.
# Una fusión NO es aceptación de una entrega material: ver
# docs/plan-orquestacion.md, «Fusión y aceptación».
on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [Carril]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: read

concurrency:
  group: union-automatica
  cancel-in-progress: false

jobs:
  unir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const REPO = `${owner}/${repo}`;
            // Identidad de cada carril en GitHub: autor de sus PR y único
            // aprobador válido de las PR del otro carril.
            const CARRILES = {
              'claude/':  { autor: 'multiserviagua-pixel', aprobador: 'Alex00111001' },
              'chatgpt/': { autor: 'Alex00111001', aprobador: 'multiserviagua-pixel' },
            };
            let numeros = [];
            if (context.eventName === 'pull_request_review') {
              numeros = [context.payload.pull_request.number];
            } else {
              const run = context.payload.workflow_run;
              if (run.path !== '.github/workflows/carril.yml' || run.repository.full_name !== REPO) { core.info('No es el Carril de este repositorio.'); return; }
              if (run.conclusion !== 'success') { core.info('Carril no está en verde.'); return; }
              numeros = (run.pull_requests || []).map(p => p.number);
            }
            const pausa = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'pausa', per_page: 1 });
            if (pausa.data.length) { core.info('Hay un issue con «pausa»: no se une nada.'); return; }

            for (const numero of numeros) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: numero });
              const nota = m => core.info(`#${numero}: ${m}`);
              if (pr.state !== 'open') { nota('no está abierta.'); continue; }
              if (pr.draft) { nota('es borrador.'); continue; }
              const prefijo = Object.keys(CARRILES).find(p => pr.head.ref.startsWith(p));
              if (!prefijo) { nota('rama sin carril: la une la persona responsable.'); continue; }
              const carrilPr = CARRILES[prefijo];
              if (!pr.head.repo || pr.head.repo.full_name !== REPO) { nota('la rama no es de este repositorio.'); continue; }
              if (pr.user.login !== carrilPr.autor) { nota(`autor ${pr.user.login} no es la identidad del carril ${prefijo}.`); continue; }
              const etiquetas = pr.labels.map(l => l.name);
              if (etiquetas.includes('pausa') || etiquetas.includes('decide-persona')) { nota(`etiqueta ${etiquetas.join(', ')}.`); continue; }

              const revisiones = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: numero, per_page: 100 });
              const ultima = new Map();
              for (const r of revisiones) {
                if (r.user.login === pr.user.login) continue;
                if (!['APPROVED', 'CHANGES_REQUESTED'].includes(r.state)) continue;
                ultima.set(r.user.login, r);
              }
              const vigentes = [...ultima.values()];
              if (vigentes.some(r => r.state === 'CHANGES_REQUESTED')) { nota('tiene «Cambios pedidos» sin resolver.'); continue; }
              const aprobada = vigentes.some(r => r.state === 'APPROVED' && r.user.login === carrilPr.aprobador && r.commit_id === pr.head.sha);
              if (!aprobada) { nota(`sin aprobación de ${carrilPr.aprobador} sobre el último commit.`); continue; }

              const archivos = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: numero, per_page: 100 });
              if (archivos.some(f => f.filename.startsWith('.github/workflows/'))) { nota('modifica workflows: la une la persona responsable.'); continue; }

              const { data: ejecuciones } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'carril.yml', head_sha: pr.head.sha, per_page: 20 });
              const carril = ejecuciones.workflow_runs.filter(w => w.path === '.github/workflows/carril.yml' && w.repository.full_name === REPO);
              if (!carril.length || carril[0].status !== 'completed' || carril[0].conclusion !== 'success') { nota('Carril no está en verde en el último commit.'); continue; }

              await github.rest.pulls.merge({ owner, repo, pull_number: numero, merge_method: 'squash', sha: pr.head.sha });
              await github.rest.issues.createComment({ owner, repo, issue_number: numero,
                body: 'Unida automáticamente: aprobada por el otro agente sobre el último commit, Carril en verde y sin `pausa` ni `decide-persona` (#27).' });
              try { await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` }); } catch (e) { nota('no se pudo borrar la rama.'); }
              nota('unida.');
            }
