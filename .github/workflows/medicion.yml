name: Medición Índice Humana IA

on:
  schedule:
    # Cada noche a las 02:00 UTC (03:00-04:00 en Madrid).
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta de la medición (p. ej. "Cierre Sprint 0")'
        required: false
        default: ''
      sitio:
        description: 'URL a medir si no es la de producción (p. ej. la de staging)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: medicion
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITIO: ${{ github.event.inputs.sitio || vars.SITIO }}
      ETIQUETA: ${{ github.event.inputs.etiqueta }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pruebas del cálculo
        run: node --test 'tests/**/*.test.mjs'

      - name: Lighthouse (móvil, mediana de 3 ejecuciones)
        run: node scripts/ejecutar-lighthouse.mjs

      - name: Checklist SEO y enlaces rotos
        run: node scripts/seo.mjs

      - name: Índice y % de evolución
        run: node scripts/indice.mjs

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "medicion-humana-ia[bot]"
          git config user.email "medicion-humana-ia@users.noreply.github.com"
          git add resultados informe.md
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Medición $(TZ=Europe/Madrid date +%F)${ETIQUETA:+ · $ETIQUETA}"
            git push
          fi
